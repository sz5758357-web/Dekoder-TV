<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Smart IPTV Decoder</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="top">
<h1>📺 Smart IPTV Decoder</h1>
<div id="clock"></div>
</div>


<div class="layout">

<aside>

<h3>Kategorie</h3>

<button onclick="category('all')">Wszystkie</button>
<button onclick="category('sport')">⚽ Sport</button>
<button onclick="category('film')">🎬 Film</button>
<button onclick="category('music')">🎵 Muzyka</button>
<button onclick="category('kids')">🧸 Dzieci</button>


<input id="search" placeholder="🔍 Szukaj">


<select id="channels" size="25"></select>


<input type="file" id="m3uFile">

</aside>



<section>

<div class="tv">

<video id="player" controls></video>

<button id="fullscreen">
⛶ Pełny ekran
</button>

</div>


<div class="info">

<h2 id="channelName">
Wybierz kanał
</h2>

<p id="program">
Brak informacji o programie
</p>

<p>
Smart IPTV Decoder • HD Player
</p>

</div>


</section>


</div>


<script src="script.js"></script>

</body>
</html>
