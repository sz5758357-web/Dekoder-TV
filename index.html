<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dekoder TV</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>📺 Dekoder TV</h1>
            <div id="search-container">
                <input type="text" id="searchInput" placeholder="Szukaj kanału...">
            </div>
        </header>
        <main>
            <div id="channel-list">
                <!-- Kanały zostaną tu wczytane przez JavaScript -->
                <div style="padding:20px;color:#aaa;text-align:center;">⏳ Ładowanie kanałów...</div>
            </div>
            <div id="player-container">
                <video id="videoPlayer" controls></video>
                <div id="no-channel-message">Wybierz kanał z listy</div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="script.js"></script>
</body>
</html>
