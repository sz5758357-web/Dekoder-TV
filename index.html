<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Smart IPTV Box</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>📺 Smart IPTV Box</h1>
</header>

<div class="container">

    <aside>
        <input type="text" id="search" placeholder="🔍 Szukaj kanału">

        <select id="channels" size="20"></select>

        <label class="upload">
            📂 Wczytaj playlistę
            <input type="file" id="m3uFile" accept=".m3u,.m3u8">
        </label>
    </aside>


    <main>

        <div class="screen">
            <video id="player" controls autoplay></video>
        </div>

        <div class="info">
            <h2 id="channelName">Wybierz kanał</h2>
            <p>Smart IPTV Player</p>
        </div>

    </main>

</div>


<script src="script.js"></script>

</body>
</html>
