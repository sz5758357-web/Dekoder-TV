<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Prosty IPTV Player</title>
</head>
<body>

    <input type="file" id="m3uFile" accept=".m3u,.m3u8">
    <select id="channelList" style="width: 300px; margin-top: 10px;">
        <option value="">Wybierz kanał...</option>
    </select>
    
    <br><br>
    <video id="videoPlayer" controls width="600"></video>

    <script>
        document.getElementById('m3uFile').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                parseM3U(content);
            };
            reader.readAsText(file);
        });

        function parseM3U(data) {
            const lines = data.split('\n');
            const select = document.getElementById('channelList');
            select.innerHTML = '<option value="">Wybierz kanał...</option>';

            let currentTitle = '';

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    // Wyciąganie nazwy kanału po przecinku
                    const parts = line.split(',');
                    currentTitle = parts.length > 1 ? parts[parts.length - 1] : 'Nieznany kanał';
                } else if (line && !line.startsWith('#')) {
                    // To jest adres URL strumienia
                    const option = document.createElement('option');
                    option.value = line;
                    option.textContent = currentTitle;
                    select.appendChild(option);
                }
            });
        }

        document.getElementById('channelList').addEventListener('change', function(e) {
            const url = e.target.value;
            const video = document.getElementById('videoPlayer');
            
            if (url) {
                video.src = url;
                video.play().catch(error => {
                    console.error("Błąd odtwarzania (może wymagać HLS.js lub brak wsparcia przeglądarki dla tego formatu):", error);
                });
            }
        });
    </script>

</body>
</html>
